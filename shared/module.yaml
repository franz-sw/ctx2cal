product:
  type: kmp/lib
  platforms: [ android, iosArm64, iosSimulatorArm64 ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.lifecycle.viewmodel.navigation3
  - $libs.androidx.navigation3.ui
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  - $libs.koin.compose.navigation3
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.coroutines.test
  - $libs.kotlinx.serialization.json

dependencies@android:
  - $compose.uiTooling
  - $libs.kotlinx.coroutines.android
  - $libs.litertlm.android
  - $libs.mlkit.genai.prompt

settings:
  compose:
    enabled: true
    resources:
      packageName: de.franzsw.ctx2cal.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    serialization: enabled
